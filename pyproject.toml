[project]
name = "phaseformer"
version = "0.1.0"
description = "Phase-domain modeling for long-term time-series forecasting"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "easydict>=1.13",
    "einops>=0.7",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pytorch-lightning>=2.1,<2.7",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "sympy>=1.12",
    # Match the CUDA 12.6 stack used for the recorded RTX 4090 experiments.
    "torch==2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
gift-eval = [
    "gluonts>=0.14,<0.17",
    "ipykernel>=6.29",
    "lightning>=2.1,<2.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
